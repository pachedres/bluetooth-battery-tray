name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) } else { $v = '0.0.0-dev' }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Publish (self-contained)
        run: dotnet publish src/BluetoothBatteryTray -c Release -r win-x64 --self-contained -p:Version=${{ steps.version.outputs.value }} -o out/self-contained

      - name: Publish (framework-dependent)
        run: dotnet publish src/BluetoothBatteryTray -c Release -r win-x64 --self-contained false -p:Version=${{ steps.version.outputs.value }} -o out/framework-dependent

      - name: Package
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.value }}'
          foreach ($kind in 'self-contained', 'framework-dependent') {
            Copy-Item scripts/*.ps1 "out/$kind"
            Compress-Archive -Path "out/$kind/*" -DestinationPath "BluetoothBatteryTray-$v-win-x64-$kind.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: BluetoothBatteryTray-${{ steps.version.outputs.value }}
          path: '*.zip'

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zips = (Get-ChildItem *.zip).FullName
          gh release create $env:GITHUB_REF_NAME @zips --title "Bluetooth Battery Tray $env:GITHUB_REF_NAME" --generate-notes
